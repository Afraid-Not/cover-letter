<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f1f9;
      font-family:
        &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial,
        sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="padding: 40px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="480"
            cellpadding="0"
            cellspacing="0"
            style="
              background: #ffffff;
              border-radius: 16px;
              overflow: hidden;
              box-shadow: 0 4px 24px rgba(109, 78, 193, 0.08);
            "
          >
            <!-- Header -->
            <tr>
              <td
                style="
                  background: linear-gradient(135deg, #7c5cbf 0%, #9b7fd4 100%);
                  padding: 36px 32px;
                  text-align: center;
                "
              >
                <div
                  style="
                    display: inline-block;
                    width: 48px;
                    height: 48px;
                    line-height: 48px;
                    background: rgba(255, 255, 255, 0.2);
                    border-radius: 12px;
                    font-size: 20px;
                    font-weight: 700;
                    color: #ffffff;
                    text-align: center;
                    margin-bottom: 12px;
                  "
                >
                  A
                </div>
                <h1
                  style="
                    margin: 12px 0 0;
                    font-size: 22px;
                    font-weight: 700;
                    color: #ffffff;
                    letter-spacing: -0.3px;
                  "
                >
                  AURA에 오신 것을 환영합니다
                </h1>
                <p
                  style="
                    margin: 6px 0 0;
                    font-size: 13px;
                    color: rgba(255, 255, 255, 0.75);
                    letter-spacing: 0.5px;
                  "
                >
                  Cover Letter Generator
                </p>
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td style="padding: 36px 32px">
                <p
                  style="
                    margin: 0 0 8px;
                    font-size: 15px;
                    color: #2d2640;
                    font-weight: 600;
                  "
                >
                  이메일 인증을 완료해주세요
                </p>
                <p
                  style="
                    margin: 0 0 28px;
                    font-size: 14px;
                    color: #6b6080;
                    line-height: 1.6;
                  "
                >
                  아래 버튼을 클릭하면 회원가입이 완료되고,<br />
                  AI 기반 자소서 생성 서비스를 바로 이용하실 수 있습니다.
                </p>

                <!-- CTA Button -->
                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                >
                  <tr>
                    <td align="center">
                      <a
                        href="{{ .ConfirmationURL }}"
                        style="
                          display: inline-block;
                          padding: 14px 40px;
                          background: linear-gradient(
                            135deg,
                            #7c5cbf 0%,
                            #9b7fd4 100%
                          );
                          color: #ffffff;
                          font-size: 14px;
                          font-weight: 600;
                          text-decoration: none;
                          border-radius: 10px;
                          letter-spacing: 0.2px;
                        "
                      >
                        이메일 인증하기
                      </a>
                    </td>
                  </tr>
                </table>

                <p
                  style="
                    margin: 28px 0 0;
                    font-size: 12px;
                    color: #a99cbd;
                    line-height: 1.6;
                    text-align: center;
                  "
                >
                  버튼이 작동하지 않으면 아래 링크를 브라우저에 직접
                  붙여넣으세요.
                </p>
                <p
                  style="
                    margin: 8px 0 0;
                    font-size: 11px;
                    color: #c4b5d6;
                    word-break: break-all;
                    text-align: center;
                  "
                >
                  {{ .ConfirmationURL }}
                </p>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td
                style="
                  padding: 20px 32px;
                  border-top: 1px solid #f0ebf5;
                  text-align: center;
                "
              >
                <p style="margin: 0; font-size: 11px; color: #b8adc8">
                  본 메일은 AURA 회원가입 요청에 의해 발송되었습니다.
                </p>
                <p style="margin: 4px 0 0; font-size: 11px; color: #b8adc8">
                  본인이 요청하지 않았다면 이 메일을 무시해주세요.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
