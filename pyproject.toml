[project]
name = "cover-letter"
version = "0.1.0"
description = "합격 자소서 기반 RAG 자소서 생성 + LLM-as-a-Judge 평가 CLI 도구"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "supabase>=2.0",
    "typer>=0.9",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "pymupdf>=1.24",
    "tavily-python>=0.5",
]

[project.scripts]
cover-letter = "src.cli:app"
